<h1>Edit your task</h1>

<form class = "task-form" [formGroup] = "taskForm" (ngSubmit)="onSubmit()">

    <label for="title">Title</label><br>
    <input type="text" id="title" formControlName="title"><br>

    <label for="details">Details</label>
    <textarea id="details" formControlName="details"></textarea>

    <select id="color" formControlName="color">
        <option value="yellow">Yellow</option>
        <option value="pink">Pink</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
    </select>

    <button type="submit">Finish Edits</button>

</form>
