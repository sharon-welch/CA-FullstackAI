<header class="page-header">
  <h1>Feed</h1>
  <p class="page-subtitle">Inspiration from everyone else. Click a post to respond with an image.</p>
</header>

<app-image-grid>
  @if (posts(); as posts) {
    @for (post of posts; track post.id) {
      <app-post-card [post]="post" />
    } @empty {
      <p class="grid-tile grid-note">Nothing in the feed yet.</p>
    }
  } @else {
    <p class="grid-tile grid-note">Loading feed…</p>
  }
</app-image-grid>
