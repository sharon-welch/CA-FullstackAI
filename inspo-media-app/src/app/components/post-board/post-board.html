<header class="page-header">
  <h1>My posts</h1>
  <p class="page-subtitle">Your saved inspiration. Click a post to see its comments.</p>
</header>

<app-image-grid>
  <app-add-tile label="Add post" [link]="['/myposts/new']" />

  @if (posts(); as posts) {
    @for (post of posts; track post.id) {
      <app-post-card [post]="post" />
    } @empty {
      <p class="grid-tile grid-note">No posts yet. Add your first one!</p>
    }
  } @else {
    <p class="grid-tile grid-note">Loading posts…</p>
  }
</app-image-grid>
