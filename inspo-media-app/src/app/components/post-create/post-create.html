<a class="back-link" routerLink="/myposts">← My posts</a>

<header class="page-header">
  <h1>Create a new post</h1>
</header>

<form class="form-card" [formGroup]="postForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="title">Title</label>
    <input id="title" type="text" formControlName="title" placeholder="Post title" />
    @if (showError(postForm.controls.title)) {
      <p class="field-error">Give your post a title (at least 2 characters)</p>
    }
  </div>

  <app-image-fields [group]="postForm.controls.image" />

  <div class="form-actions">
    <a class="button button-secondary" routerLink="/myposts">Cancel</a>
    <button class="button" type="submit">Publish post</button>
  </div>
</form>
