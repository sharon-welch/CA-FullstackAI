<p>comment-create works!</p>

<form class="comment-form" [formGroup]="commentForm" (ngSubmit)="onSubmit()">
    <!-- <label for="title">Title</label>
    <input id="title" type="text" formControlName="title" placeholder="Post Title" /> -->

    <label for="imageURL">Add the link to your image here</label>
    <input id="imageURL" type="url" formControlName="imageURL" />

    <!-- <label for="imageFile">Upload your image here (.png or .jpeg)</label>
    <input id="imageFile" type="file" formControlName="imageFile" accept="image/png, image/jpeg" /> -->
 
    <label for="description">Comment</label>
    <textarea id="description" formControlName="description" rows="3" placeholder="Comment text"></textarea>

    <!-- <label for="citation">Citation</label>
    <textarea id="citation" formControlName="citation" rows="3" placeholder="Citation information (URL, book citation, etc.)"></textarea> -->

    <button type="submit" [disabled]="commentForm.invalid">Post Comment</button>
</form>
