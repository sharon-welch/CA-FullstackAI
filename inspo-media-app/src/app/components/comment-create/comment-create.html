<a class="back-link" [routerLink]="postLink()">← Back to post</a>

<header class="page-header">
  <h1>Add a comment</h1>
  @if (post(); as post) {
    <p class="page-subtitle">Responding to “{{ post.title }}”</p>
  }
</header>

<form class="form-card" [formGroup]="commentForm" (ngSubmit)="onSubmit()">
  <app-image-fields [group]="commentForm" descriptionLabel="Caption" />

  <div class="form-actions">
    <a class="button button-secondary" [routerLink]="postLink()">Cancel</a>
    <button class="button" type="submit">Post comment</button>
  </div>
</form>
