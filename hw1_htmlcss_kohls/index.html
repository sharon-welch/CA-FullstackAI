<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- header with navigation and search -->
        <header>
            <div class ="container logo">
                <img id="logo" src= "assets/logo.png">
            </div>
            <div>
                <input type ="text">What are you looking for today?</input>
            </div>
            <div>
                <button class="btn" type="button">Ask Kohl's</button>
            </div>
            <ul class="list-sign-in">
                <li><img id="sign-in" src ="assets/sign-in.png">Sign in</img></li>
                <li><img id="my-list" src ="assets/heart.png">My list</img></li>
                <li><img id="cart" src ="assets/cart.png">$0.00</img></li>
            </ul>
        </header>

        <!-- top most navigation menu below the header -->
        <div class="container nav-1">
            <div class = "container menus">
                <div class = "dropdown-1">
                    <label for="shop-category">Shop by Category</label>
                    <select name="shop-category" id="shop-category">
                        <option value="college">College Essentials</option>
                        <option value="school">Back to School</option>
                        <option value="new">New and Trending</option>
                        <option value="home">Home & Pet</option>
                        <option value="women">Women</option>
                        <option value="men">Men</option>
                        <option value="baby">Baby</option>
                    </select>
                </div>

                <div class = "dropdown-2">
                    <label for="store">My Store: Select Store</label>
                    <select name="store" id="store">
                        <option value="set-store">Set my Store</option>
                    </select>
                </div>
            </div>

            <div class = "container links">
                <ul class="list-nav-1">
                    <li>Kohl's Card</li>
                    <li>Baby Registry</li>
                    <li>Kohl's Coupons</li>
                    <li>Help</li>
                </ul>
            </div>
        </div>

        <!-- Second navigation menu. You could also use nav here but I chose a list because we aren't including functionality -->
        <div class ="container nav-2">
            <ul class="list-nav-2">
                <li id="sale">Sale & Clearance</li>
                <li>College Essentials</li>
                <li>Back to School</li>
                <li>New and Trending</li>
                <li>Home & Pet</li>
                <li>Women</li>
                <li>Men</li>
                <li>Baby</li>
                <li>Kids & Toys</li>
                <li>Shoes</li>
            </ul>
        </div>


        <!-- image -->
        <div class="container image">
            <img id="family" src="assets/family.jpg">
            <!-- <div class="image-text">Summer styles that turn quick outings into all day plans</div> -->
            <!-- <div>Shop Now</div> -->
        </div>
    

    </body>


</html>
